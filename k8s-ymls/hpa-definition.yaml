apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  namespace: voting-app
  name: voteapp-hpa
  labels:
    app: vote
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vote-deploy
  minReplicas: 1
  maxReplicas: 3

  metrics:
    - type: Resource
      resource:
        name: cpu
        target: 
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target: 
          type: Utilization
          averageUtilization: 70
