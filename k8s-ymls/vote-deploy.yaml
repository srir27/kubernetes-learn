apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: voting-app
  name: vote-deployment
  labels:
    app: vote
spec:
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - name: vote
        image: votingappaks-f3e8d4b2gwhcaua7.azurecr.io/vote:v1
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"
          requests:
            memory: "32Mi"
            cpu: "50m"